<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Iframe</title>
    <script src="pluginBridge.min.js"></script>
    <script>
      pluginBridge.register({
        init: function(info) {},
        navigateTo: function() {},
        receiveEvents: function() {
          pluginBridge.annotateEvent()
          pluginBridge.annotateSession()
          pluginBridge.deletePlugin()
          pluginBridge.flushConnection()
          pluginBridge.navigateTo()
          pluginBridge.selectEvents()
          pluginBridge.sendCommand()
          pluginBridge.trackEvent({
            action: 'select',
            element: 'Test element',
            feature: 'test-plugin',
            type: 'list-item',
            widget: { name: 'test-widget', type: 'dialog' }
          }).then(function() {
            window.parent.postMessage({ type: 'trackEventOutcome', outcome: 'fulfilled' }, '*')
          }, function() {
            window.parent.postMessage({ type: 'trackEventOutcome', outcome: 'rejected' }, '*')
          })
          pluginBridge.uploadPlugin()
        },
        receiveSelectedEvents: function() {},
        receiveSession: function() {},
        receiveValidation: function() {}
      });
    </script>
  </head>
  <body>
    Iframe
  </body>
</html>
